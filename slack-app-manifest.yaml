display_information:
  name: gpt
  description: Reply to @gpt mentions with the OpenAI API.
  background_color: "#1A1D21"
features:
  bot_user:
    display_name: gpt
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - files:write
      - reactions:write
settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
