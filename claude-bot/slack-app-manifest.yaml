display_information:
  name: claude
  description: Reply to @claude mentions using the Anthropic API.
  background_color: "#D97757"
features:
  bot_user:
    display_name: claude
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - reactions:write
settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
